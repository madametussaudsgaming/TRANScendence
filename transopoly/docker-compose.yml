services:
  game:
    build: ./backend/game
    container_name: transopoly-game
    restart: unless-stopped
    # For testing on your machine only. Once nginx (HTTPS) and Rails are added,
    # remove "ports" so the engine is reachable only inside the Docker network
    # (Rails will call it at http://game:8000).
    ports:
      - "127.0.0.1:8000:8000"

